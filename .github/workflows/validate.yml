name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the gitleaks scan

      - name: Set up Bats
        uses: bats-core/bats-action@4.0.0

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.14.1

      - name: Set up chezmoi
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/chezmoi_2.72.2_linux_amd64.tar.gz" \
            https://github.com/twpayne/chezmoi/releases/download/v2.72.2/chezmoi_2.72.2_linux_amd64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/chezmoi_2.72.2_checksums.txt" \
            https://github.com/twpayne/chezmoi/releases/download/v2.72.2/chezmoi_2.72.2_checksums.txt
          (
            cd "$RUNNER_TEMP"
            grep ' chezmoi_2.72.2_linux_amd64.tar.gz$' chezmoi_2.72.2_checksums.txt \
              | sha256sum --check --strict
          )
          tar -xzf "$RUNNER_TEMP/chezmoi_2.72.2_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/bin" chezmoi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up gitleaks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/gitleaks_8.30.1_checksums.txt" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          (
            cd "$RUNNER_TEMP"
            grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt \
              | sha256sum --check --strict
          )
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            -C "$RUNNER_TEMP/bin" gitleaks

      - name: Scan history for secrets
        run: gitleaks git --redact --verbose

      - name: Check Bash syntax
        run: |
          find scripts/unix tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n scripts/unix/dots

      - name: Run ShellCheck
        run: |
          find scripts/unix tests -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
          shellcheck -x scripts/unix/dots .githooks/*

      - name: Check shell formatting
        run: shfmt -d -i 2 -ci -bn scripts/unix tests .githooks

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Run isolated tests
        run: bats tests

      - name: Validate chezmoi templates
        run: ./tests/validate-templates.sh

  arch:
    # The primary Linux platform: real pacman, run as a regular user like on CachyOS
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Install tools and a regular user
        run: |
          pacman -Syu --noconfirm --needed git chezmoi bats jq openssh diffutils
          useradd --create-home tester

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Hand the checkout to the test user
        run: chown -R tester:tester "$GITHUB_WORKSPACE"

      - name: Run Bats tests
        run: runuser -u tester -- env HOME=/home/tester bats tests

      - name: Validate chezmoi templates
        run: runuser -u tester -- env HOME=/home/tester ./tests/validate-templates.sh

      - name: Dry-run bootstrap
        run: |
          runuser -u tester -- env HOME=/home/tester bash -euo pipefail -c '
            mkdir -p "$HOME/.config/chezmoi"
            chezmoi execute-template --init \
              --promptString "Git user name=CI User,Git email=ci@example.test,GitHub username (optional)=ci,SSH key email=ci@example.test" \
              <home/.chezmoi.toml.tmpl >"$HOME/.config/chezmoi/chezmoi.toml"
            before="$(find "$HOME" -mindepth 1 | sort)"
            ./scripts/unix/bootstrap.sh --dry-run --non-interactive --skip-accounts
            if [[ "$before" != "$(find "$HOME" -mindepth 1 | sort)" ]]; then
              echo "The dry-run changed HOME" >&2
              exit 1
            fi
          '

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up chezmoi
        shell: pwsh
        run: |
          $version = '2.72.2'
          $archive = "chezmoi_${version}_windows_amd64.zip"
          $base = "https://github.com/twpayne/chezmoi/releases/download/v$version"
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          Invoke-WebRequest "$base/$archive" -OutFile (Join-Path $env:RUNNER_TEMP $archive)
          Invoke-WebRequest "$base/chezmoi_${version}_checksums.txt" -OutFile (Join-Path $env:RUNNER_TEMP 'checksums.txt')
          $expected = (Get-Content (Join-Path $env:RUNNER_TEMP 'checksums.txt') |
            Where-Object { $_ -match " $([regex]::Escape($archive))$" }).Split(' ')[0]
          $actual = (Get-FileHash (Join-Path $env:RUNNER_TEMP $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "chezmoi checksum mismatch: $actual" }
          Expand-Archive (Join-Path $env:RUNNER_TEMP $archive) -DestinationPath $bin
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Write a test chezmoi config
        shell: pwsh
        run: |
          $configDir = Join-Path $HOME '.config\chezmoi'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          Get-Content home/.chezmoi.toml.tmpl -Raw |
            chezmoi execute-template --init --promptString 'Git user name=CI User,Git email=ci@example.test,GitHub username (optional)=ci,SSH key email=ci@example.test' |
            Set-Content (Join-Path $configDir 'chezmoi.toml')
          chezmoi cat-config

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @('scripts/windows', 'tests/windows' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 })
          $results | Format-Table -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          if ($results.Count -gt 0) { exit 1 }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests/windows -CI -Output Detailed

      - name: Dry-run bootstrap on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/windows/bootstrap.ps1 -DryRun -NonInteractive -SkipGit -SkipAccounts

      - name: Dry-run bootstrap on PowerShell 7
        shell: pwsh
        run: ./scripts/windows/bootstrap.ps1 -DryRun -NonInteractive -SkipGit -SkipAccounts
