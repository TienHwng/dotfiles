# fcitx5 for every Wayland session (KDE Plasma and Hyprland).
# Do not set GTK_IM_MODULE or QT_IM_MODULE here: on Wayland they bypass the compositor's
# text-input protocol, which breaks Vietnamese typing and input-method switching
# (fcitx5-diagnose warns about it). GTK and Qt 6 use text-input; Qt 5 falls back to fcitx.
XMODIFIERS=@im=fcitx
QT_IM_MODULES=wayland;fcitx
SDL_IM_MODULE=fcitx
