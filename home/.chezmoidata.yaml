gitName: ""
gitEmail: ""
githubUsername: ""
sshEmail: ""

features:
  installFonts: true
  setupShell: true
  wallpapers: true

# Private Git LFS repository cloned by home/.chezmoiexternal.toml.tmpl (L6)
wallpapers:
  repo: https://github.com/TienHwng/wallpapers.git
  dir: Pictures/wallpaper
  current: space2.jpg

accounts:
  ssh:
    # bitwarden: keys live in the vault and the Bitwarden desktop SSH agent serves them.
    # file: a passphrase-protected key file on disk (headless machines without Bitwarden).
    agent: bitwarden
    keyType: ed25519
    keyPathArch: ~/.ssh/id_ed25519
    keyPathUnix: ~/.ssh/id_ed25519
    keyPathWindows: ~/.ssh/id_ed25519
