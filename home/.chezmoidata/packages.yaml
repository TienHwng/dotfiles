# Package manifest: the single list of packages for every platform.
#
# mapped:  apps that exist under several package managers. One entry per app;
#          each key names the package for that manager. Omit a key when the app
#          is not installed there. `gui: true` entries are skipped when
#          DOTFILES_HEADLESS=1 (WSL, servers). `vendor: X` entries are installed
#          only on hardware whose manufacturer contains X (DMI sys_vendor on
#          Linux, Win32_ComputerSystem on Windows; DOTFILES_VENDOR overrides).
# <list>:  packages that exist for one manager only.
#
# Lists: arch (paru, CachyOS/Arch), apt, brew, brewCask, winget, scoop, nerdFonts.
# Windows: winget for GUI and system apps, scoop for CLI tools. Scoop names may
# carry a bucket ("extras/app"); the bucket is added before installing.
# Scripts read them with scripts/package-list.tmpl; see docs/design.md (L2).

packages:
  mapped:
    - name: git
      arch: git
      apt: git
      brew: git
      winget: Git.Git
    - name: neovim
      arch: neovim
      apt: neovim
      brew: neovim
      scoop: neovim
    - name: ripgrep
      arch: ripgrep
      apt: ripgrep
      brew: ripgrep
      scoop: ripgrep
    - name: fd
      arch: fd
      apt: fd-find
      brew: fd
      scoop: fd
    - name: bat
      apt: bat
      brew: bat
      scoop: bat
    - name: fzf
      arch: fzf
      apt: fzf
      brew: fzf
      scoop: fzf
    - name: jq
      arch: jq
      apt: jq
      brew: jq
      scoop: jq
    - name: 7zip
      arch: 7zip
      scoop: 7zip
    - name: github-cli
      arch: github-cli
      scoop: gh
    - name: tmux
      arch: tmux
      apt: tmux
      brew: tmux
    - name: zsh
      arch: zsh
      apt: zsh
      brew: zsh
    - name: curl
      apt: curl
      brew: curl
    - name: wget
      apt: wget
      brew: wget
    - name: rsync
      apt: rsync
      brew: rsync
    - name: python
      apt: python3
      brew: python
      winget: Python.Python.3.13
    - name: pipx
      apt: pipx
      brew: pipx
    - name: wl-clipboard
      gui: true
      arch: wl-clipboard
      apt: wl-clipboard
    - name: gum
      arch: gum
      brew: gum
      scoop: gum
    # Secrets and SSH keys (L1): desktop app serves the SSH agent, bw renders templates
    - name: bitwarden
      gui: true
      arch: bitwarden
      brewCask: bitwarden
      winget: Bitwarden.Bitwarden
    - name: bitwarden-cli
      arch: bitwarden-cli
      brew: bitwarden-cli
      scoop: bitwarden-cli
    - name: oh-my-posh
      arch: oh-my-posh-bin
      scoop: oh-my-posh
    - name: wezterm
      gui: true
      brewCask: wezterm
      winget: wez.wezterm
    # ASUS laptop tools; the owner keeps Armoury Crate rather than G-Helper (2026-10-29)
    - name: armoury-crate
      gui: true
      vendor: ASUS
      winget: Asus.ArmouryCrate
    # Repository validation (make validate, pre-commit secret scan)
    - name: shellcheck
      arch: shellcheck
      apt: shellcheck
      brew: shellcheck
      scoop: shellcheck
    - name: shfmt
      arch: shfmt
      apt: shfmt
      brew: shfmt
      scoop: shfmt
    - name: gitleaks
      arch: gitleaks
      scoop: gitleaks

  arch:
    # Base system, boot, and package tooling
    - linux-firmware
    - efibootmgr
    - grub
    - os-prober
    - update-grub
    - cachy-update
    - paru
    - chezmoi
    - pipewire-pulse
    - wireplumber
    - polkit-kde-agent
    # Boot splash
    - plymouth
    - plymouth-theme-colorful-loop-git
    - plymouth-theme-connect-git
    - plymouth-theme-cubes-git
    - plymouth-theme-cuts-alt-git
    - plymouth-theme-cuts-git
    - plymouth-theme-hud-3-git
    - plymouth-theme-loader-2-git
    - plymouth-theme-lone-git
    - plymouth-theme-motion-git
    - plymouth-theme-owl-git
    - plymouth-theme-splash-git
    # Hyprland session
    - hyprland
    - hyprpaper
    - xdg-desktop-portal-hyprland
    - waybar
    - wofi
    - noctalia
    - grim
    - slurp
    # Input method (Vietnamese)
    - fcitx5
    - fcitx5-bamboo
    - fcitx5-configtool
    - fcitx5-gtk
    - fcitx5-lotus
    - fcitx5-qt
    - fcitx5-unikey
    # Fonts and cursor
    - bibata-cursor-theme
    - cantarell-fonts
    - noto-fonts
    - noto-fonts-cjk
    - ttf-dejavu
    - ttf-firacode-nerd
    - ttf-jetbrains-mono-nerd
    - ttf-liberation
    - ttf-meslo-nerd
    - ttf-opensans
    # Terminal and CLI tools
    - kitty
    - btop
    - git-delta
    - git-lfs
    - glow
    - lazygit
    - navi
    - nano
    - vim
    - thefuck
    - yazi
    - zoxide
    - ffmpeg
    - imagemagick
    - poppler
    - resvg
    - bats
    # Fun
    - cava
    - cbonsai
    - cmatrix
    - lolcat
    - pipes.sh
    - tty-clock
    # Applications
    - brave-bin
    - vivaldi
    - discord
    - visual-studio-code-bin

  apt:
    - ca-certificates
    - unzip
    - zip
    - build-essential
    - python3-pip
    - fontconfig
    - xclip

  brew: []

  brewCask: []

  winget:
    - Microsoft.PowerShell
    - Microsoft.WindowsTerminal
    - Microsoft.PowerToys

  scoop: []

  # Nerd Fonts release archive names, installed per user by install-fonts
  # (Linux: release archive; Windows: Scoop nerd-fonts/<name>-NF)
  nerdFonts:
    - JetBrainsMono
