# KDE Plasma settings, managed per key (L4). The `desktop` step of dots reads them through
# scripts/kde-settings.tmpl, shows current -> new for each key that differs, and writes them
# with kwriteconfig6. Whole *rc files are not managed: Plasma rewrites them constantly.
#
# lookAndFeel: global theme, applied with plasma-apply-lookandfeel (it also sets the colors).
# settings:    one entry per key, for every machine. group is a list for nested groups
#              ([services][kitty.desktop]). Global shortcuts are "active,default,friendly name".
# machines:    extra settings for one machine, keyed by its hostname (.chezmoi.hostname): hardware
#              such as one laptop's touchpad. They come after the shared settings; an entry with
#              the same file, group and key replaces the shared one on that machine.
# Screen-specific state (panels, tiling, display layout) stays manual.
# discover:    files `dots capture kde --discover` skips (shell globs): screen, panel and
#              session state that Plasma rewrites on its own.

kde:
  lookAndFeel: org.kde.breezetwilight.desktop
  discover:
    ignore:
      - plasma-org.kde.plasma.desktop-appletsrc
      - plasmashellrc
      - kactivitymanagerd*
      - "*staterc"
  # fcitx5 input methods (the "Default" group): first the keyboard layout, then the input
  # methods in switching order; default is the one the trigger key activates. fcitx5 rewrites its
  # profile from memory, so a running fcitx5 gets the list over D-Bus, not through the file.
  fcitx5:
    layout: us
    inputMethods: [keyboard-us, bamboo, lotus, unikey]
    default: lotus
  settings:
    # Global shortcuts (take effect after the next login)
    - { file: kglobalshortcutsrc, group: [ksmserver], key: Shut Down, value: "Meta+U,none,Shut Down" }
    - { file: kglobalshortcutsrc, group: [kwin], key: Edit Tiles, value: "none,Meta+T,Toggle Tiles Editor" }
    - { file: kglobalshortcutsrc, group: [plasmashell], key: next activity, value: "Meta+A,none,Walk through activities" }
    - { file: kglobalshortcutsrc, group: [plasmashell], key: previous activity, value: "Meta+Shift+A,none,Walk through activities (Reverse)" }
    - { file: kglobalshortcutsrc, group: [services, kitty.desktop], key: _launch, value: "Meta+T" }
    # KWin
    - { file: kwinrc, group: [Wayland], key: InputMethod, value: /usr/share/applications/fcitx5-wayland-launcher.desktop }
    - { file: kwinrc, group: [NightColor], key: Active, value: "true" }
    - { file: kwinrc, group: [Desktops], key: Number, value: "1" }
    - { file: kwinrc, group: [Desktops], key: Rows, value: "1" }
    # Look and default apps
    - { file: kdeglobals, group: [KDE], key: contrast, value: "4" }
    - { file: kdeglobals, group: [KDE], key: frameContrast, value: "0.2" }
    - { file: kdeglobals, group: [General], key: BrowserApplication, value: vivaldi-stable.desktop }
    - { file: mimeapps.list, group: [Default Applications], key: x-scheme-handler/http, value: vivaldi-stable.desktop }
    - { file: mimeapps.list, group: [Default Applications], key: x-scheme-handler/https, value: vivaldi-stable.desktop }
    - { file: mimeapps.list, group: [Default Applications], key: text/html, value: vivaldi-stable.desktop }
    # Power: on AC, never turn the display off (takes effect after the next login)
    - { file: powerdevilrc, group: [AC, Display], key: TurnOffDisplayWhenIdle, value: "false" }
    - { file: powerdevilrc, group: [AC, Display], key: TurnOffDisplayIdleTimeoutSec, value: "-1" }
    # Splash screen (theme in home/dot_local/share/plasma/look-and-feel/a2n.kuro)
    - { file: ksplashrc, group: [KSplash], key: Engine, value: KSplashQML }
    - { file: ksplashrc, group: [KSplash], key: Theme, value: a2n.kuro }

  # Per machine, keyed by .chezmoi.hostname
  machines:
    HwngPC:
      settings:
        # Touchpad and mouse, per device (vendor id, product id, name; take effect after the next login)
        - { file: kcminputrc, group: [Libinput, "1267", "12410", "ELAN1203:00 04F3:307A Touchpad"], key: NaturalScroll, value: "true" }
        - { file: kcminputrc, group: [Libinput, "1267", "12410", "ELAN1203:00 04F3:307A Touchpad"], key: PointerAcceleration, value: "0.400" }
        - { file: kcminputrc, group: [Libinput, "1267", "12410", "ELAN1203:00 04F3:307A Touchpad"], key: PointerAccelerationProfile, value: "1" }
        - { file: kcminputrc, group: [Libinput, "1267", "12410", "ELAN1203:00 04F3:307A Touchpad"], key: ScrollFactor, value: "0.3" }
        - { file: kcminputrc, group: [Libinput, "14139", "4569", "Compx Wireless mouse 8k dongle-L"], key: PointerAccelerationProfile, value: "1" }
