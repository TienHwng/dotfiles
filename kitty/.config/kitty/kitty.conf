# =============================================================================
# Kitty Configuration
# File: ~/.config/kitty/kitty.conf
# =============================================================================

# ========== Font ==========
font_family MesloLGS Nerd Font Mono
font_size   14.0


# ========== Cursor ==========
cursor_shape                 beam
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
# cursor_trail_color           none


# ========== Window ==========
# Restart Kitty after changing this option.
# hide_window_decorations titlebar-only

background_opacity       0.85
window_padding_width     10
confirm_os_window_close  0
# window_margin_width 21.75


# ========== Shell ==========
shell zsh


# ========== Theme ==========
# Enable only one theme source at a time.
# include ~/.config/kitty/colors-matugen.conf

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# ========== Mapping keystrokes ==========
include ~/.config/kitty/mapping.conf