# Owner's pacman options, included from the [options] section of /etc/pacman.conf by
# root/etc/modify_pacman.conf. The distribution keeps the rest of pacman.conf (repositories,
# SigLevel, HoldPkg); every key here is removed from pacman.conf's [options], so it is set once.
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
# Kernel and NVIDIA driver update only on purpose (pacman -Syu --ignore none, or paru -S)
IgnorePkg = linux-cachyos linux-cachyos-headers linux-cachyos-nvidia-open
IgnorePkg = linux-cachyos-lts linux-cachyos-lts-headers linux-cachyos-lts-nvidia-open
IgnorePkg = nvidia-utils lib32-nvidia-utils opencl-nvidia lib32-opencl-nvidia nvidia-settings libxnvctrl
