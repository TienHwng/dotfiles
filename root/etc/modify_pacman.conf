{{- /* chezmoi:modify-template */ -}}
{{- /* Keeps the distribution's /etc/pacman.conf and makes its [options] section include
       /etc/pacman.d/dots.conf: the Include line goes right after [options], and option lines
       for keys that dots.conf sets are dropped (dots.conf owns them). Idempotent. */ -}}
{{- $include := "Include = /etc/pacman.d/dots.conf" -}}
{{- $owned := dict -}}
{{- range splitList "\n" (include "etc/pacman.d/dots.conf") -}}
{{-   $line := trim . -}}
{{-   if and $line (not (hasPrefix "#" $line)) -}}
{{-     $_ := set $owned (trim (first (splitList "=" $line))) true -}}
{{-   end -}}
{{- end -}}
{{- $section := "" -}}
{{- $out := list -}}
{{- range splitList "\n" .chezmoi.stdin -}}
{{-   $line := trim . -}}
{{-   $key := trim (first (splitList "=" $line)) -}}
{{-   if hasPrefix "[" $line -}}
{{-     $section = $line -}}
{{-   end -}}
{{-   if not (or (eq $line $include) (and (eq $section "[options]") (hasKey $owned $key))) -}}
{{-     $out = append $out . -}}
{{-   end -}}
{{-   if eq $line "[options]" -}}
{{-     $out = append $out $include -}}
{{-   end -}}
{{- end -}}
{{- join "\n" $out -}}
