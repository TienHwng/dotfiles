# =============================================================================
# Kitty Color Theme
# File: ~/.config/kitty/colors-matugen.conf
# =============================================================================


# -----------------------------------------------------------------------------
# Basic Colors
# -----------------------------------------------------------------------------

foreground #e5e1e4
background #0e0e10


# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------

selection_foreground #312f39
selection_background #c8c5d2


# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

cursor            #c7c3e1
cursor_text_color #302e45


# -----------------------------------------------------------------------------
# URLs
# -----------------------------------------------------------------------------

url_color #c8c5d2


# -----------------------------------------------------------------------------
# ANSI 16-Color Palette
# -----------------------------------------------------------------------------

# Black
color0 #141315
color8 #353436

# Red
# Replaced the original near-black red values for better visibility.
color1 #d18a9e
color9 #ffafc1

# Green
color2  #c8c5d2
color10 #e5e0ee

# Yellow
color3  #e2bcce
color11 #ffd8ea

# Blue
color4  #46445c
color12 #c7c3e1

# Magenta
color5  #474550
color13 #c8c5d2

# Cyan
color6  #5a3f4d
color14 #e2bcce

# White
color7  #c9c5cd
color15 #e5e1e4


# -----------------------------------------------------------------------------
# Marks
# -----------------------------------------------------------------------------

mark1_foreground #1b192f
mark1_background #e4dffd

mark2_foreground #1c1a24
mark2_background #e5e0ee

mark3_foreground #2b1421
mark3_background #ffd8ea


# -----------------------------------------------------------------------------
# Tabs
# -----------------------------------------------------------------------------

active_tab_foreground #302e45
active_tab_background #c7c3e1

inactive_tab_foreground #bebad7
inactive_tab_background #2f2d44

# Match the main terminal background.
tab_bar_background #0e0e10


# -----------------------------------------------------------------------------
# Window Borders
# -----------------------------------------------------------------------------

active_border_color   #c7c3e1
inactive_border_color #302e45

# Bright orange makes terminal bell notifications easy to notice.
bell_border_color #ff5a00